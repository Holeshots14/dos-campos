<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dos Campos | Hats for Every Style</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>DOS CAMPOS</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">New Arrivals</a>
        <a href="#">About</a>
      </nav>

      <a href="#">Cart</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <h2>Find Your Next Hat</h2>

          <p>Find the one that fits you.</p>

          <button>Shop Now</button>
        </div>
      </section>

      <section class="categories">
        <h2>Shop by Style</h2>

        <div class="category-list">
          <a href="#" class="category trucker">
            <span>Trucker</span>
          </a>

          <a href="#" class="category sport">
            <span>Sport</span>
          </a>

          <a href="#" class="category dress">
            <span>Dress</span>
          </a>

          <a href="#" class="category funny">
            <span>Funny</span>
          </a>
        </div>
      </section>

      <section class="featured">
        <h2>Featured Hats</h2>

        <div class="product-list">
          <div class="product">
            <div class="product-image">Product Image</div>

            <h3>Hat Name</h3>

            <p>$29.99</p>
          </div>

          <div class="product">
            <div class="product-image">Product Image</div>

            <h3>Hat Name</h3>

            <p>$34.99</p>
          </div>

          <div class="product">
            <div class="product-image">Product Image</div>

            <h3>Hat Name</h3>

            <p>$29.99</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 Dos Campos</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
